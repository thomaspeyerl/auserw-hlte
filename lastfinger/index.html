<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Finger">
<title>Last Finger Standing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05010d;--fg:#f3ecff;--dim:#a99fd0;--c:#ff2bd6;color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05010d;--fg:#f3ecff;--dim:#a99fd0}}
:root[data-theme="dark"]{--bg:#05010d;--fg:#f3ecff;--dim:#a99fd0}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Orbitron",system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fx{position:fixed;inset:0;pointer-events:none}
body.gl .fx{display:none}
#scan{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.07) 3px 4px)}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.hud{position:fixed;left:0;right:0;pointer-events:none;text-align:center;padding:0 16px}
.pill{display:inline-flex;flex-direction:column;align-items:center;gap:7px;padding:11px 22px 10px;border-radius:999px;background:rgba(14,5,30,.46);border:1px solid rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(176,38,255,.2),0 10px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%)}

/* Kopfzeile, Logo und Statusanzeige */
#top{top:calc(env(safe-area-inset-top,0px) + 14px);opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
#top.on{opacity:1;transform:none}
#top .pill{padding:7px 16px 6px 19px;font-size:10px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#e9e2ff}
#logo{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9vh);text-align:center;pointer-events:none;font-weight:900;font-size:clamp(28px,min(9.2vw,11vh),72px);line-height:1;letter-spacing:.04em;color:#ffe6fb;
  text-shadow:0 0 2px #fff,0 0 10px #ff2bd6,0 0 26px #ff2bd6,0 0 60px #b026ff;transition:opacity .5s,transform .5s;animation:logoIn 1.4s cubic-bezier(.2,.8,.2,1) both,flick 7s 1.4s infinite}
#logo span{display:block;margin-bottom:.35em;padding-left:.5em;font-size:.34em;font-weight:700;letter-spacing:.5em;color:#d9fdff;text-shadow:0 0 8px #00f0ff,0 0 22px #00f0ff}
#logo.hide{opacity:0;transform:translateY(-24px) scale(.94)}
@keyframes logoIn{0%{letter-spacing:.6em;filter:blur(10px) brightness(2.5)}100%{letter-spacing:.04em;filter:none}}
@keyframes flick{0%,91%,96%,100%{filter:none}92%,94.5%{filter:brightness(.35)}93.2%{filter:none}}
#msg{top:50%;transform:translateY(-50%);font-size:clamp(17px,5.4vw,30px);font-weight:900;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 4px #fff,0 0 14px var(--c),0 0 34px var(--c),0 0 70px var(--c);transition:opacity .35s}
#msg b{display:block;font-weight:900}
#msg small{display:block;margin-top:18px;font-size:.42em;font-weight:500;line-height:1.9;letter-spacing:.14em;text-transform:none;color:var(--dim);text-shadow:none}
@media (orientation:landscape){#msg{top:58%;font-size:clamp(15px,min(5.4vw,5vh),30px)}}
#msg.blink b{animation:neon 4s infinite}
@keyframes neon{0%,19%,23%,26%,54%,58%,100%{opacity:1}21%,25%,56%{opacity:.25}}
#msg.up{top:calc(env(safe-area-inset-top,0px) + 58px);transform:none;font-size:clamp(12px,3.6vw,16px)}
#msg.up b{text-shadow:0 0 10px var(--c)}
#msg.up small{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:0;font-size:.66em;letter-spacing:.18em;text-transform:uppercase}
#msg i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--d);box-shadow:0 0 8px var(--d),0 0 10px var(--d)}

/* Bombe über dem markierten Finger, Platz-Schilder der Ausgeschiedenen */
#bomb{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;opacity:0;transition:transform .06s ease-out,opacity .2s;will-change:transform}
#bomb.on{opacity:1}
#bomb svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px #ff6b00) drop-shadow(0 0 16px #ff1744)}
#bomb.hold svg{animation:wob .12s infinite}
@keyframes wob{0%,100%{transform:rotate(-7deg) scale(1.05)}50%{transform:rotate(7deg) scale(1.14)}}
#bomb .spark{transform-box:fill-box;transform-origin:center;animation:spark .09s infinite alternate}
@keyframes spark{from{opacity:1;transform:scale(1)}to{opacity:.45;transform:scale(1.6)}}
.tomb{position:fixed;left:0;top:0;pointer-events:none;padding:5px 11px 4px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#d8d0f0;white-space:nowrap;
  background:rgba(14,5,30,.66);border:1px solid rgba(255,255,255,.18);transform:var(--p);animation:tomb .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes tomb{0%{opacity:0;transform:var(--p) scale(2.2)}100%{opacity:1;transform:var(--p) scale(1)}}
#msg i.dead{background:#4a4360;box-shadow:none;opacity:.7}
#tombs{transition:opacity .6s}
#tombs.dim{opacity:.45}
#back{pointer-events:auto;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:6px 10px}
/* Gewinner: Krone und Titel */
/* Countdown 3 – 2 – 1 – LOS! im Energiekern zwischen den Fingern */
#count{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
#count span{position:absolute;left:0;top:0;font-weight:900;font-size:clamp(90px,30vw,220px);line-height:1;color:#fff;white-space:nowrap;
  text-shadow:0 0 6px #fff,0 0 22px var(--c),0 0 60px var(--c),0 0 120px var(--c);animation:cnt 1s cubic-bezier(.2,.9,.3,1) forwards}
#count span.go{font-size:clamp(56px,19vw,150px);animation:go .9s ease-out forwards}
#count span.long{font-size:clamp(32px,11vw,90px)}
@keyframes cnt{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2);filter:blur(10px)}18%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}72%{opacity:.95;transform:translate(-50%,-50%) scale(.96)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
@keyframes go{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.7);filter:blur(6px)}}
#crown{position:fixed;left:0;top:0;width:72px;height:54px;pointer-events:none;opacity:0;--c:#ff2bd6;will-change:transform}
#crown.show{opacity:1}
#crown svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px #ffe07a) drop-shadow(0 0 14px var(--c))}
#crown.show svg{animation:drop .8s cubic-bezier(.3,1.7,.5,1) both,bob 2.4s .8s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-160px) rotate(-30deg) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
#title{position:fixed;left:0;right:0;text-align:center;pointer-events:none;font-weight:900;font-size:clamp(28px,8.6vw,84px);letter-spacing:.03em;line-height:1.2;color:#fff;opacity:0;
  text-shadow:0 0 3px #fff,0 0 14px var(--c),0 0 34px var(--c),0 0 80px var(--c)}
#title::before,#title::after{content:attr(data-t);position:absolute;inset:0;text-shadow:none;opacity:.85;mix-blend-mode:screen;clip-path:inset(0 0 100% 0)}
#title::before{color:#00f0ff;animation:g1 2.6s infinite steps(1)}
#title::after{color:#ff2bd6;animation:g2 2.6s infinite steps(1)}
@keyframes g1{0%,80%{clip-path:inset(0 0 100% 0);transform:none}84%{clip-path:inset(10% 0 55% 0);transform:translate(-5px,0)}88%{clip-path:inset(60% 0 8% 0);transform:translate(4px,0)}92%{clip-path:inset(0 0 100% 0);transform:none}}
@keyframes g2{0%,82%{clip-path:inset(0 0 100% 0);transform:none}86%{clip-path:inset(40% 0 30% 0);transform:translate(5px,0)}90%{clip-path:inset(5% 0 75% 0);transform:translate(-4px,0)}94%{clip-path:inset(0 0 100% 0);transform:none}}
#title.show{animation:slam .65s cubic-bezier(.18,1.5,.32,1) forwards,beat 1.8s .7s ease-in-out infinite}
@keyframes slam{0%{opacity:0;transform:scale(3.4);filter:blur(14px) brightness(3)}55%{opacity:1;filter:blur(0) brightness(1.6)}100%{opacity:1;transform:scale(1);filter:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* Fußzeile und Ton-Schalter */
#bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:9px}
#seed{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10px;letter-spacing:.12em;color:rgba(214,205,255,.55)}
#hint{max-width:calc(100vw - 24px);padding:9px 16px 8px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
#hint.on{opacity:1;transform:none;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 14px rgba(176,38,255,.2)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 28px rgba(0,240,255,.45)}}
.ibtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%;color:#f3ecff;cursor:pointer;touch-action:none;
  background:rgba(14,5,30,.46);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 18px rgba(176,38,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:color .2s,box-shadow .2s}
#music{right:64px}
.ibtn svg{width:20px;height:20px}
.ibtn .off,.ibtn.muted .on{display:none}
.ibtn.muted .off{display:inline}
.ibtn.muted{color:rgba(243,236,255,.5);box-shadow:none}
.ibtn:focus-visible{outline:2px solid #00f0ff;outline-offset:2px}
body.gl3d #crown{display:none}
</style>
</head>

<circle cx="3" cy="13" r="3.2" fill="#fff"/><circle cx="36" cy="5" r="3.8" fill="#fff"/><circle cx="69" cy="13" r="3.2" fill="#fff"/>

<script id="fate">
/* ---------- Zufall: frischer Seed je Runde + seeded PRNG (ohne DOM, damit tests/ ihn direkt prüfen) ---------- */
var Fate=(()=>{
let entropy=(Math.random()*4294967296)>>>0;
function mix(x,y,t){entropy=Math.imul(entropy^((x*1000)|0)^(((y*1000)|0)<<7)^((t*1000)|0),2654435761)>>>0;}
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return (t>>>0)/4294967296;};}
function freshSeed(){const s=new Uint32Array(4);
  if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(s);else for(let i=0;i<4;i++)s[i]=(Math.random()*4294967296)>>>0;
  s[0]^=(performance.now()*1000)>>>0;s[1]^=Date.now()>>>0;s[2]^=entropy;s[3]^=(Math.random()*4294967296)>>>0;
  if(!(s[0]|s[1]|s[2]|s[3]))s[3]=1;return s;}
/* Finger im Uhrzeigersinn um ihren Schwerpunkt – in dieser Reihenfolge springt die Auswahl */
function ring(list){let cx=0,cy=0;list.forEach(f=>{cx+=f.x;cy+=f.y;});cx/=list.length;cy/=list.length;
  return list.slice().sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));}
/* Weg der Bombe in einer Runde über m lebende Finger (Indizes 0..m-1 in Kreis-Reihenfolge): erst wilde Sprünge kreuz und quer,
   dann im Uhrzeigersinn auslaufend bis zum Ziel. Bei 2 Fingern gibt es nur Hin und Her. */
function hops(m,start,target,rng){const path=[start];let cur=start;
  if(m<3){const steps=(4+Math.floor(rng()*2))*m+((target-start+m)%m);for(let i=0;i<steps;i++){cur=(cur+1)%m;path.push(cur);}return {path,chaos:0};}
  const C=6+m+Math.floor(rng()*m),F=m+1+Math.floor(rng()*m),o=((target-F)%m+m)%m;
  for(let j=1;j<=C;j++){let nx=o;if(j<C){const ban=j===C-1?o:-1;do nx=Math.floor(rng()*m);while(nx===cur||nx===ban);}path.push(nx);cur=nx;}
  for(let j=0;j<F;j++){cur=(cur+1)%m;path.push(cur);}
  return {path,chaos:C};}
/* K.-o.-Plan: Ausscheide-Reihenfolge per Fisher-Yates – jede der n! Reihenfolgen ist gleich wahrscheinlich, der Letzte gewinnt.
   Erst danach entstehen aus demselben Seed die Wege der Bombe; jeder endet beim geplanten Opfer der Runde. */
function knockout(list){const s=freshSeed(),rng=sfc32(s[0],s[1],s[2],s[3]);for(let i=0;i<24;i++)rng();
  const order=ring(list),n=order.length,perm=order.map((_,i)=>i);
  for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1)),t=perm[i];perm[i]=perm[j];perm[j]=t;}
  const elim=perm.slice(0,n-1),alive=order.map((_,i)=>i),rounds=[];let pos=Math.floor(rng()*n);
  for(const target of elim){const m=alive.length,h=hops(m,alive.indexOf(pos),alive.indexOf(target),rng);
    rounds.push({alive:alive.slice(),target,chaos:h.chaos,path:h.path.map(i=>alive[i])});
    alive.splice(alive.indexOf(target),1);pos=alive[Math.floor(rng()*alive.length)];}
  return {order,elim,winner:perm[n-1],rounds,hex:[...s].map(v=>v.toString(16).padStart(8,'0')).join('').toUpperCase()};}
return {mix,sfc32,freshSeed,ring,hops,knockout};
})();
</script>
<script id="music">
/* ---------- Musik & Soundeffekte: Synthwave komplett aus Web-Audio-Oszillatoren (ohne Audiodateien, ohne DOM) ---------- */
var Music=(()=>{
const BPM=104,S16=60/BPM/4,mtof=m=>440*Math.pow(2,(m-69)/12);
/* Akkordfolge Am – F – C – G: Bass-Grundton, Pad-Voicing und Arpeggio-Töne */
const CH=[{root:33,pad:[57,60,64],arp:[69,72,76,81]},{root:29,pad:[57,60,65],arp:[65,69,72,77]},{root:36,pad:[55,60,64],arp:[67,72,76,79]},{root:31,pad:[55,59,62],arp:[67,71,74,79]}];
const ARP=[0,1,2,3,2,1,0,2,1,3,2,1,0,1,2,3];
/* Siegesmelodie je Takt: [16tel-Position, MIDI-Ton, Länge in 16teln] */
const LEAD=[[[0,76,4],[4,79,2],[6,81,4],[10,79,2],[12,76,4]],[[0,77,4],[4,76,2],[6,74,2],[8,72,6],[14,74,2]],[[0,76,4],[4,79,4],[8,84,6],[14,83,2]],[[0,81,4],[4,79,4],[8,76,8]]];
function create(ac,out){
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
  const master=ac.createGain();master.gain.value=.5;master.connect(comp);comp.connect(out);
  /* Hall: Faltung mit selbst erzeugtem, abklingendem Rauschen; Echo: Verzögerung mit gefilterter Rückkopplung */
  const rev=ac.createConvolver();{const len=ac.sampleRate*2.6|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}rev.buffer=b;}
  const revOut=ac.createGain();revOut.gain.value=.45;rev.connect(revOut);revOut.connect(master);
  const dly=ac.createDelay(1),dfb=ac.createGain(),dlp=ac.createBiquadFilter();dly.delayTime.value=S16*3;dfb.gain.value=.36;dlp.type='lowpass';dlp.frequency.value=2400;
  dly.connect(dlp);dlp.connect(dfb);dfb.connect(dly);const dlyOut=ac.createGain();dlyOut.gain.value=.5;dlp.connect(dlyOut);dlyOut.connect(master);
  /* Musik-Bus (mit Tiefpass für den „Unterwasser“-Moment vor der Entscheidung) und Effekt-Bus, beide getrennt stummschaltbar */
  const musIn=ac.createGain(),musLP=ac.createBiquadFilter();musLP.type='lowpass';musLP.frequency.value=18000;musLP.Q.value=.7;musIn.connect(musLP);musLP.connect(master);
  const dry=ac.createGain(),wet=ac.createGain(),wetSend=ac.createGain(),wetRev=ac.createGain(),wetDly=ac.createGain();
  dry.connect(musIn);wet.connect(musIn);wet.connect(wetSend);wetSend.connect(wetRev);wetSend.connect(wetDly);wetRev.gain.value=.55;wetDly.gain.value=.3;wetRev.connect(rev);wetDly.connect(dly);
  const fx=ac.createGain(),fxSend=ac.createGain(),fxDry=ac.createGain(),fxWet=ac.createGain();fxDry.connect(fx);fxWet.connect(fx);fxWet.connect(fxSend);fx.connect(master);fxSend.gain.value=.5;fxSend.connect(rev);
  const noiseBuf=ac.createBuffer(1,ac.sampleRate*2|0,ac.sampleRate);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const now=t=>t==null?ac.currentTime:t;
  function osc(type,f,t,end,dest){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(dest);o.start(t);o.stop(end);return o;}
  function env(t,peak,a,dec,dest){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setTargetAtTime(0,t+a,dec);g.connect(dest);return g;}
  function noise(t,dur,dest){const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.connect(dest);s.start(t,Math.random()*1.5);s.stop(t+dur);return s;}
  function filt(type,f,q,dest){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!=null)b.Q.value=q;b.connect(dest);return b;}
  /* Instrumente */
  function kick(t,v){const g=env(t,v,.002,.12,dry);osc('sine',150,t,t+.5,g).frequency.exponentialRampToValueAtTime(44,t+.12);noise(t,.03,filt('highpass',2500,null,env(t,v*.2,.001,.008,dry)));}
  function snare(t,v){noise(t,.4,filt('bandpass',1900,.7,env(t,v*.7,.002,.07,wet)));osc('triangle',190,t,t+.3,env(t,v*.4,.002,.05,dry)).frequency.exponentialRampToValueAtTime(140,t+.1);}
  function hat(t,v,dec){noise(t,dec*6+.02,filt('highpass',7500,null,env(t,v,.001,dec,dry)));}
  function bass(t,m,len,br,v){v=v||.3;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setTargetAtTime(v*.66,t+.006,.08);g.gain.setTargetAtTime(0,t+len,.03);g.connect(dry);
    const lp=filt('lowpass',400+br*2200,4,g);lp.frequency.setTargetAtTime(160+br*500,t,.07);
    osc('sawtooth',mtof(m),t,t+len+.25,lp);osc('square',mtof(m)*1.004,t,t+len+.25,lp);}
  function arp(t,m,v,br){const lp=filt('lowpass',900+br*3600,2,env(t,v,.004,.09,wet));osc('square',mtof(m),t,t+.6,lp);osc('sawtooth',mtof(m)*1.005,t,t+.6,lp);}
  function pad(t,notes,len,v){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.5);g.gain.setValueAtTime(v,t+len);g.gain.linearRampToValueAtTime(0,t+len+1.2);g.connect(wet);
    const lp=filt('lowpass',1400,.3,g);for(const m of notes)for(const d of [-8,8])osc('sawtooth',mtof(m),t,t+len+1.3,lp).detune.value=d;}
  function lead(t,m,len,v){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.setTargetAtTime(v*.7,t+.015,.15);g.gain.setTargetAtTime(0,t+len,.08);g.connect(wet);
    const lp=filt('lowpass',3200,1,g),lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(9,t+.25);lfo.connect(lg);lfo.start(t);lfo.stop(t+len+.5);
    for(const [type,d] of [['sawtooth',-6],['square',6]]){const o=osc(type,mtof(m),t,t+len+.5,lp);o.detune.value=d;lg.connect(o.detune);}}
  function crash(t,v,d){noise(t,2.5,filt('highpass',4500,null,env(t,v,.002,.45,d||wet)));}
  function riser(t,dur,v){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+.05);g.connect(wet);
    const bp=filt('bandpass',300,2.5,g);bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(6000,t+dur);noise(t,dur+.1,bp);}
  /* Sequenzer: spielt 16tel für 16tel; welche Spuren laufen, hängt vom Spielzustand ab */
  let M='idle',E=0,nextT=-1,step=0;
  function playStep(s,t){const bar=(s>>4)&3,i=s&15,c=CH[bar];
    if(M==='hold')return;
    if(i===0)pad(t,c.pad,S16*16,M==='idle'?.016:.04);
    if(M==='idle'){if(i%4===0)arp(t,c.arp[ARP[i]],.03,.15);if(i===0||i===8)bass(t,c.root,S16*7,.05,.08);if(i%8===4)hat(t,.015,.03);return;}
    if(i%4===0)kick(t,.9);
    if(M==='wait'){hat(t,.06,.02);if(i%2===0)arp(t,c.arp[ARP[i]],.055,.4);bass(t,c.root+(i%2?12:0),S16*.9,.3);return;}
    const win=M==='finale'||M==='done';
    if(i===4||i===12)snare(t,.5);
    hat(t,i%2?.07:.04,i%4===2?.06:.025);
    bass(t,c.root+(i%2?12:0),S16*.85,win?.8:E);
    arp(t,c.arp[ARP[i]],.06,win?.9:.3+E*.7);
    if(win){if(i===0&&bar===0)crash(t,.22);for(const n of LEAD[bar])if(n[0]===i)lead(t,n[1],n[2]*S16,.1);}}
  function schedule(until){if(nextT<ac.currentTime)nextT=ac.currentTime+.03;while(nextT<until){playStep(step,nextT);nextT+=S16;step++;}}
  /* Zustandswechsel; t erlaubt exaktes Timing (auch beim Offline-Rendern in den Tests) */
  function mode(m,t,dur){t=now(t);if(m===M)return;M=m;const f=musLP.frequency;f.cancelScheduledValues(t);
    if(m==='hold'){f.setValueAtTime(18000,t);f.exponentialRampToValueAtTime(380,t+.35);return;}
    f.setValueAtTime(18000,t);
    if(m==='wait')riser(t,dur||3,.16);
    if(m==='choose'||m==='finale'){step=0;nextT=t;}}
  function fade(g,on,t){t=now(t);g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(on?1:0,t+.25);}
  /* Soundeffekte */
  const sfx={
    place(n,t){t=now(t);const f=mtof(72+[0,3,7,10,12,15,19,22,24,27,31,34][n%12]);osc('triangle',f,t,t+.6,env(t,.16,.003,.12,fxWet)).frequency.exponentialRampToValueAtTime(f*2,t+.06);osc('sine',f*3,t+.03,t+.4,env(t+.03,.05,.002,.06,fxWet));},
    remove(t){t=now(t);osc('triangle',520,t,t+.4,env(t,.12,.003,.08,fxWet)).frequency.exponentialRampToValueAtTime(150,t+.15);},
    count(i,t){t=now(t);const f=mtof(81+i*2);osc('square',f,t,t+.3,filt('lowpass',3500,1,env(t,.09,.003,.07,fxWet)));osc('sine',f/2,t,t+.3,env(t,.12,.003,.08,fxDry));},
    go(t){t=now(t);const f=mtof(93);osc('square',f,t,t+.6,filt('lowpass',5000,1,env(t,.1,.003,.16,fxWet)));osc('sine',f/2,t,t+.6,env(t,.14,.003,.18,fxDry));},
    start(t){t=now(t);const bp=filt('bandpass',300,1.5,env(t,.28,.15,.25,fxWet));bp.frequency.exponentialRampToValueAtTime(4500,t+.6);noise(t,1,bp);osc('sine',60,t,t+.9,env(t,.35,.02,.2,fxDry)).frequency.exponentialRampToValueAtTime(130,t+.5);},
    hop(p,t,j){t=now(t);osc('square',mtof(60+Math.round(p*24)+(j||0)),t,t+.3,filt('lowpass',1500+p*4000,3,env(t,.06+p*.06,.002,.05,fxWet)));},
    beat(t){t=now(t);osc('sine',62,t,t+.6,env(t,.9,.004,.11,fxDry)).frequency.exponentialRampToValueAtTime(38,t+.2);noise(t,.05,filt('lowpass',600,null,env(t,.15,.001,.02,fxDry)));},
    impact(t){t=now(t);osc('sine',95,t,t+1.6,env(t,1,.005,.45,fxDry)).frequency.exponentialRampToValueAtTime(26,t+1.3);
      const lp=filt('lowpass',9000,.8,env(t,.5,.002,.35,fxWet));lp.frequency.exponentialRampToValueAtTime(120,t+1.2);noise(t,1.6,lp);
      const st=filt('lowpass',2600,.5,env(t,.07,.005,.5,fxWet));for(const m of [48,60,64,67,72,76])osc('sawtooth',mtof(m),t,t+2,st);crash(t,.35,fxWet);},
    firework(t){t=now(t);noise(t,.4,filt('lowpass',3000,null,env(t,.18,.002,.06,fxWet)));for(let i=0;i<6;i++){const s=t+.08+Math.random()*.35;noise(s,.03,filt('highpass',5000,null,env(s,.06,.001,.01,fxWet)));}},
    boom(t){t=now(t);osc('sine',120,t,t+1,env(t,.95,.004,.28,fxDry)).frequency.exponentialRampToValueAtTime(30,t+.7);
      const lp=filt('lowpass',6000,.7,env(t,.6,.002,.22,fxWet));lp.frequency.exponentialRampToValueAtTime(180,t+.9);noise(t,1.1,lp);
      for(let i=0;i<8;i++){const c=t+.05+Math.random()*.5;noise(c,.04,filt('highpass',3500,null,env(c,.08,.001,.012,fxWet)));}},
    fuse(t,dur){t=now(t);const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.05);g.gain.setValueAtTime(.07,t+dur);g.gain.linearRampToValueAtTime(0,t+dur+.05);g.connect(fxWet);
      noise(t,dur+.1,filt('bandpass',4200,1.5,g));for(let i=0;i*.12<dur;i++)osc('square',1800,t+i*.12,t+i*.12+.04,env(t+i*.12,.03,.001,.01,fxDry));},
    crown(t){t=now(t);[84,88,91,96].forEach((m,i)=>osc('sine',mtof(m),t+i*.06,t+i*.06+2,env(t+i*.06,.09,.002,.5+i*.15,fxWet)));}
  };
  return {schedule,mode,energy:x=>{E=x;},setMusic:(on,t)=>{fade(musIn,on,t);fade(wetSend,on,t);},setSfx:(on,t)=>{fade(fx,on,t);fade(fxSend,on,t);},sfx};
}
return {create};
})();
</script>
<script>
(()=>{
let cv=document.getElementById('c'),ctx=null,GLR=null;
const $=id=>document.getElementById(id);
const bombEl=$('bomb'),tombsEl=$('tombs'),backEl=$('back'),countEl=$('count'),msgEl=$('msg'),titleEl=$('title'),seedEl=$('seed'),hintEl=$('hint'),topEl=$('top'),muteBtn=$('mute'),musicBtn=$('music'),logoEl=$('logo'),crownEl=$('crown');
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,qs=1;

const NEON=['#ff2bd6','#00f0ff','#39ff14','#fff01f','#ff6b00','#b026ff','#ff1744','#00ff9c','#4d7cff','#ff9ef5','#c6ff00','#00b3ff'];
const cache={},c01={};
function rgb(h){if(cache[h])return cache[h];const n=parseInt(h.slice(1),16);return cache[h]=[(n>>16)&255,(n>>8)&255,n&255];}
function rgba(h,a){const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function rgb01(h){return c01[h]||(c01[h]=rgb(h).map(v=>v/255));}

const mix=e=>Fate.mix(e.clientX,e.clientY,performance.now());

/* ---------- Sound: Musik-Engine startet mit der ersten Berührung (vorher erlauben Browser keinen Ton) ---------- */
let AC=null,snd=null,soundOn=true,musicOn=true;
try{soundOn=localStorage.getItem('aw-sound')!=='0';musicOn=localStorage.getItem('aw-music')!=='0';}catch(e){}
function initAudio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();snd=Music.create(AC,AC.destination);snd.setSfx(soundOn);snd.setMusic(soundOn&&musicOn);syncMusic();
    setInterval(()=>{if(AC.state==='running')snd.schedule(AC.currentTime+.2);},50);}
  if(AC.state==='suspended')AC.resume();}
function musicMode(){return state==='waiting'?'wait':state==='choosing'?(finalHold&&aliveCount()===2?'hold':'choose'):state==='finale'?'finale':state==='done'?'done':'idle';}
function syncMusic(){if(snd)snd.mode(musicMode(),undefined,WAIT/1000);}
const at=d=>AC?AC.currentTime+(d||0):0;
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function updAudioBtns(){muteBtn.classList.toggle('muted',!soundOn);musicBtn.classList.toggle('muted',!musicOn||!soundOn);
  if(snd){snd.setSfx(soundOn);snd.setMusic(soundOn&&musicOn);}
  try{localStorage.setItem('aw-sound',soundOn?'1':'0');localStorage.setItem('aw-music',musicOn?'1':'0');}catch(e){}}
[muteBtn,musicBtn].forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();}));
muteBtn.addEventListener('click',()=>{soundOn=!soundOn;updAudioBtns();});
musicBtn.addEventListener('click',()=>{musicOn=!musicOn;if(musicOn)soundOn=true;updAudioBtns();});
updAudioBtns();
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume();});

/* ---------- Zustand ---------- */
const fingers=new Map(),touches=new Set(),parts=[],rings=[],MAXF=12,MAXP=6500;
let state='idle',waitStart=0,lastTick=-1,order=[],path=[],chaosN=0,hl=-1,steps=0,step=0,nextAt=0,finalHold=false,winner=null;
let finaleStart=0,doneStart=0,resetAt=0,nextFw=0,round=0,mouseN=0,shake=0,flash=0,flashCol='#ffffff',beam=null;
let seedHex='',sweep=0,nextGhost=0,chroma=0,beats=[],idleA=1,linkA=0,hubPos={x:0,y:0},crownOn=false,crownT0=0,camScroll=0,camSpd=1.4,camKick=0,ko=null,rnd=0,pauseUntil=0,outs=[];
const WAIT=3000,TAIL_MS=4800;let baseR=44,delays=[];

function addP(p){if(parts.length<MAXP)parts.push(p);}
function burst(x,y,col,n,spd,sz){for(let i=0;i<n;i++){const a=Math.random()*6.2832,s=(.25+Math.random())*spd,life=28+Math.random()*50;
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:sz||(2+(Math.random()*4|0)),col:Math.random()<.15?'#ffffff':col,drag:.955,g:0});}}
/* Konfetti: flatternde, rotierende Plättchen in allen Neonfarben */
function confetti(x,y,n,spd,up){for(let i=0;i<n;i++){const a=Math.random()*6.2832,s=(.3+Math.random())*spd,life=150+Math.random()*130;
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(up||0),life,max:life,size:5+Math.random()*5,col:NEON[Math.random()*NEON.length|0],drag:.96,g:.07,t:1,rot:Math.random()*6.2832,vr:(Math.random()-.5)*.35,fl:Math.random()*6.2832});}}
function pixRing(x,y,col,dur,maxR,w,delay,a){rings.push({x,y,col,t0:performance.now()+(delay||0),dur,maxR,w,a:a==null?1:a});}
/* Mittelpunkt und Größe der Portal-Ringe im Startbildschirm; im Querformat tiefer, damit das Logo frei bleibt */
function portal(){return W>H?{x:W/2,y:H*.58,m:H*.62}:{x:W/2,y:H/2,m:Math.min(W,H)};}
function hub(list){let x=0,y=0;for(const f of list){x+=f.x;y+=f.y;}return {x:x/list.length,y:y/list.length};}
const aliveList=()=>order.filter(f=>!f.dead),aliveCount=()=>order.reduce((s,f)=>s+(f.dead?0:1),0);
function baseTarget(n){return 44*Math.min(1,Math.sqrt(4/n))*Math.min(1.4,Math.max(.8,Math.min(W,H)/400));}
/* Oberkante der Krone (54 px hoch) über dem Gewinner; ist oben kein Platz, rutscht sie darunter */
function crownTop(w,R){const y=w.y-R*1.32-66;return y<8?w.y+R*1.32+10:y;}

/* Neue Finger bekommen die Farbe, deren Farbton am weitesten von den vergebenen entfernt ist */
const HUE={};NEON.forEach(c=>{const [r,g,b]=rgb(c).map(v=>v/255),mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);let h=0;if(d)h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;HUE[c]=(h*60+360)%360;});
function pickColor(){const used=[...fingers.values()].map(f=>f.col),free=NEON.filter(c=>!used.includes(c)),pool=free.length?free:NEON;
  if(!used.length)return pool[Math.floor(Math.random()*pool.length)];
  const sc=pool.map(c=>Math.min(...used.map(u=>{const d=Math.abs(HUE[c]-HUE[u]);return Math.min(d,360-d);}))),mx=Math.max(...sc),best=pool.filter((c,i)=>sc[i]>=mx*.8);
  return best[Math.floor(Math.random()*best.length)];}
function addFinger(id,x,y,mouse){if(fingers.size>=MAXF)return;const f={id,x,y,col:pickColor(),born:performance.now(),mouse,ph:Math.random()*6.2832,lifted:false,dying:0};
  fingers.set(id,f);burst(x,y,f.col,50,5);pixRing(x,y,f.col,560,140,6);if(snd)snd.sfx.place(fingers.size);buzz(18);armWait();}
function dropFinger(id){const f=fingers.get(id);if(!f)return;
  if(state==='idle'||state==='waiting'){fingers.delete(id);burst(f.x,f.y,f.col,34,3);if(snd)snd.sfx.remove();armWait();}
  else f.lifted=true;}
function armWait(){if(fingers.size>=2){state='waiting';waitStart=performance.now();lastTick=-1;}else{state='idle';countEl.innerHTML='';}updHud();syncMusic();}
function showCount(txt,col,go){countEl.innerHTML='<span class="'+(go?'go':'')+(String(txt).length>4?' long':'')+'" style="--c:'+col+'">'+txt+'</span>';}
function reset(){tombsEl.innerHTML='';pauseUntil=0;outs=[];fingers.clear();order=[];winner=null;hl=-1;beam=null;beats=[];state='idle';resetAt=0;titleEl.className='';countEl.innerHTML='';updHud();syncMusic();}

/* ---------- Eingabe ---------- */
const onCanvas=e=>e.target&&e.target.tagName==='CANVAS';
document.addEventListener('pointerdown',e=>{if(!onCanvas(e))return;e.preventDefault();initAudio();mix(e);const now=performance.now();
  if(e.pointerType==='mouse'){if(e.button!==0)return;
    if(state==='done'){reset();return;}
    if(state==='choosing'||state==='finale')return;
    for(const f of fingers.values())if(f.mouse&&Math.hypot(f.x-e.clientX,f.y-e.clientY)<60){dropFinger(f.id);return;}
    addFinger('m'+(mouseN++),e.clientX,e.clientY,true);return;}
  const wasEmpty=touches.size===0;touches.add(e.pointerId);
  if(state==='done'){if(wasEmpty&&now-doneStart>800)reset();else return;}
  if(state==='choosing'||state==='finale')return;
  addFinger(e.pointerId,e.clientX,e.clientY,false);
},{passive:false});
document.addEventListener('pointermove',e=>{mix(e);const f=fingers.get(e.pointerId);if(f&&!f.lifted&&!f.mouse&&state!=='finale'&&state!=='done'){f.x=e.clientX;f.y=e.clientY;}},{passive:true});
function up(e){if(e.pointerType==='mouse')return;touches.delete(e.pointerId);dropFinger(e.pointerId);
  if(state==='done'&&touches.size===0)resetAt=Math.max(performance.now()+1400,doneStart+2600);}
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
['touchstart','touchmove','touchend'].forEach(t=>document.addEventListener(t,e=>{if(onCanvas(e))e.preventDefault();},{passive:false}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- HUD ---------- */
const dots=list=>list.map(f=>'<i style="--d:'+f.col+'"></i>').join('');
function updHud(){let h='',blink=false;
  if(state==='idle'){if(fingers.size===0){h='<b>Finger aufs<br>Display!</b><small>Bei wem die Bombe hochgeht, fliegt raus –<br>wer übrig bleibt, gewinnt'+(FINE?'<br>Am Desktop: Klick setzt einen Punkt,<br>Klick auf den Punkt entfernt ihn':'')+'</small>';blink=true;}
    else h='<span class="pill"><b>Noch ein Finger …</b><small>Mindestens 2 Spieler</small></span>';}
  else if(state==='waiting')h='<span class="pill"><b>Still halten …</b><small>'+dots([...fingers.values()])+fingers.size+' Spieler</small></span>';
  else if(state==='choosing'){const m=aliveCount();h='<span class="pill"><b>'+(m<=2?'Finale':'Runde '+(rnd+1)+' von '+(order.length-1))+'</b><small>'+order.map(f=>'<i'+(f.dead?' class="dead"':'')+' style="--d:'+f.col+'"></i>').join('')+m+' übrig</small></span>';}
  msgEl.innerHTML=h;msgEl.classList.toggle('blink',blink);msgEl.classList.toggle('up',fingers.size>0);
  msgEl.style.opacity=(state==='finale'||state==='done')?0:1;
  logoEl.classList.toggle('hide',!(state==='idle'&&fingers.size===0));backEl.style.visibility=state==='idle'&&!fingers.size?'visible':'hidden';
  hintEl.textContent=state==='done'?(order.some(f=>!f.mouse)?'Alle Finger loslassen für das nächste Spiel':'Klick für das nächste Spiel'):'';
  hintEl.classList.toggle('on',state==='done');tombsEl.classList.toggle('dim',state==='finale'||state==='done');
  topEl.innerHTML=round?'<span class="pill">Spiel '+round+'</span>':'';topEl.classList.toggle('on',round>0);}
updHud();

/* ---------- Auswahl ---------- */
function startChoosing(){const now=performance.now();ko=Fate.knockout([...fingers.values()]);order=ko.order;order.forEach(f=>{f.dead=0;f.place=0;});
  rnd=0;outs=[];winner=null;round++;seedHex=ko.hex;state='choosing';
  {const c=hub(order);pixRing(c.x,c.y,'#ffffff',700,Math.hypot(W,H)*.45,8,0,.6);}
  flash=Math.max(flash,RM?.05:.16);flashCol='#ffffff';
  seedEl.textContent='Seed 0x'+seedHex.slice(0,16)+'…';
  showCount('LOS!','#00f0ff',true);buzz([40,40,80]);if(snd){snd.sfx.go();snd.sfx.start();}order.forEach(f=>pixRing(f.x,f.y,f.col,600,160,5));startRound(now);}
/* Neue Runde: Die Bombe springt erst wild umher und läuft dann auf das nächste Opfer aus (der Weg steht im K.-o.-Plan) */
function startRound(now){const R=ko.rounds[rnd],m=R.alive.length;path=R.path;steps=path.length-1;step=0;chaosN=R.chaos;hl=path[0];finalHold=false;pauseUntil=0;beats=[];
  delays=[];for(let i=0;i<chaosN;i++)delays.push((85+50*i/chaosN)*(.65+.7*Math.random()));
  {const F=steps-chaosN,T=m===2?3600:1800;let sw=0;const w=[];for(let i=1;i<=F;i++){const v=.08+Math.pow(i/F,2.4);w.push(v);sw+=v;}w.forEach(v=>delays.push(Math.min(1100,Math.max(80,T*v/sw))));}
  nextAt=now+(rnd?350:260);{const c=hub(aliveList());sweep=Math.atan2(order[hl].y-c.y,order[hl].x-c.x);}
  if(rnd)showCount(m===2?'FINALE':'RUNDE '+(rnd+1),m===2?'#ff1744':'#ff6b00',true);
  if(snd)snd.energy(rnd/Math.max(1,order.length-1));syncMusic();updHud();}
/* Die Bombe geht hoch: Finger scheidet aus und bekommt seinen Platz – Feuerball, Schockwellen, Splitter, Knall */

  for(let i=0;i<280;i++){const a=Math.random()*6.2832,s=1+Math.random()*13,life=40+Math.random()*70;
    addP({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:2+(Math.random()*6|0),col:['#ffffff','#fff01f','#ff6b00','#ff1744',f.col][Math.random()*5|0],drag:.93,g:.06});}
  [['#ffffff',500,170,9,0],['#ff6b00',800,280,8,60],[f.col,1000,380,6,140]].forEach(([c,d,r,w,dl])=>pixRing(f.x,f.y,c,d,r,w,dl));
  if(snd)snd.sfx.boom();buzz([80,40,160]);
  const t=document.createElement('div');t.className='tomb';t.textContent='Platz '+f.place;t.style.setProperty('--p','translate('+Math.round(f.x)+'px,'+Math.round(f.y+baseR*1.15)+'px) translate(-50%,-50%)');tombsEl.appendChild(t);

function updBomb(){const on=state==='choosing'&&!pauseUntil&&hl>=0;bombEl.classList.toggle('on',on);bombEl.classList.toggle('hold',on&&finalHold);

function startFinale(){const now=performance.now(),w=winner;state='finale';finaleStart=now;

    for(let i=0;i<130;i++)addP({x:f.x+(Math.random()-.5)*70,y:f.y+(Math.random()-.5)*70,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:220,max:220,size:3+(Math.random()*3|0),col:f.col,drag:.94,g:0,home:w,delay:Math.random()*25});});

/* Titel in den größten freien Bereich über oder unter Gewinner + Krone setzen */
function placeTitle(w){const fs=Math.max(28,Math.min(84,W*.086)),R=baseTarget(1)*1.6,ct=crownTop(w,R);
  const top=Math.min(ct,w.y-R*1.5)-14,bot=Math.max(ct+54,w.y+R*1.5)+14,a0=70,b1=H-100;
  const y=(top-a0)>=(b1-bot)?(a0+top)/2:(bot+b1)/2;titleEl.style.top=Math.round(y-fs*.62)+'px';}
function updCount(){if(state!=='waiting'&&state!=='choosing')return;const c=hubPos,x=Math.min(W*.78,Math.max(W*.22,c.x)),y=Math.min(H*.78,Math.max(H*.25,c.y));countEl.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px)';}
function updCrown(){const on=!!winner&&(state==='done'||state==='finale'&&performance.now()-finaleStart>500);
  if(on!==crownOn){crownOn=on;if(on){crownT0=performance.now();crownEl.style.setProperty('--c',winner.col);}crownEl.className=on?'show':'';}
  if(on)crownEl.style.transform='translate('+Math.round(winner.x-36)+'px,'+Math.round(crownTop(winner,baseR*1.6))+'px)';}

/* ---------- Update ---------- */
function rain(n){for(let i=0;i<n;i++){const life=H/5+40;addP({x:Math.random()*W,y:-10,vx:0,vy:5+Math.random()*7,life,max:life,size:GLR?1.5+Math.random()*2:3+(Math.random()*4|0),col:Math.random()<.3?'#ffffff':winner.col,drag:1,g:.05});}}
function update(now,k){
  if(state==='idle'&&Math.random()<.55*k){const life=260+Math.random()*200;addP({x:Math.random()*W,y:H+6,vx:0,vy:-(.3+Math.random()*1),life,max:life,size:2+(Math.random()*2|0),col:NEON[Math.random()*NEON.length|0],drag:1,g:0,dim:true});}
  if(state==='idle'&&!fingers.size&&now>nextGhost){nextGhost=now+700+Math.random()*1100;pixRing(W*(.1+Math.random()*.8),H*(.15+Math.random()*.7),NEON[Math.random()*NEON.length|0],1100,50+Math.random()*50,4,0,.35);}
  if(state==='waiting'){const p=(now-waitStart)/WAIT,sec=Math.floor((now-waitStart)/1000),left=Math.ceil(WAIT/1000)-sec;
    /* jede volle Sekunde: neue Zahl, Piepton, Vibration und ein Puls-Ring aus dem Kern */
    if(sec>lastTick&&left>0){lastTick=sec;showCount(left,left===1?'#ff2bd6':left===2?'#b026ff':'#4d7cff');if(snd)snd.sfx.count(sec);buzz(30);
      const c=hub([...fingers.values()]);pixRing(c.x,c.y,'#ffffff',600,90+sec*40,5,0,.7);}
    fingers.forEach(f=>{if(Math.random()<.35*k){const a=Math.random()*6.2832;addP({x:f.x+Math.cos(a)*60,y:f.y+Math.sin(a)*60,vx:0,vy:-1-Math.random()*2,life:40,max:40,size:3,col:f.col,drag:.98,g:0});}});
    if(p>=1)startChoosing();}
  if(state==='choosing'){
    if(pauseUntil){if(now>=pauseUntil){rnd++;startRound(now);}}
    else if(now>=nextAt){
      if(finalHold){const tgt=order[hl],last=aliveCount()===2;explode(tgt,now);if(last){winner=aliveList()[0];startFinale();}else{pauseUntil=now+1100;updHud();}}
      else{const prev=order[hl];step++;hl=path[step];const cur=order[hl],p=step/steps,wild=step<=chaosN;
        beam={a:prev,b:cur,t:now,col:cur.col};
        burst(cur.x,cur.y,cur.col,(14+p*24)|0,3+p*4);pixRing(cur.x,cur.y,cur.col,360,100,4);
        if(snd){snd.sfx.hop(p,undefined,wild?Math.floor(Math.random()*13)-6:0);snd.energy(Math.min(1,(rnd+p)/Math.max(1,order.length-1)));}
        if(!RM)shake=Math.max(shake,1+p*4);buzz(8);chroma=Math.max(chroma,RM?0:.003*p);
        nextAt=now+delays[step-1];
        if(step>=steps){finalHold=true;
          if(aliveCount()===2){nextAt=now+1500;beats=[now,now+380,now+900,now+1150];if(snd)[0,.38,.9,1.15].forEach(d=>snd.sfx.beat(at(d)));syncMusic();}
          else{nextAt=now+800;if(snd)snd.sfx.fuse(undefined,.8);}}}}
    /* Herzschlag vor der letzten Explosion: Puls-Ring, Farbsaum und Ruckeln im Takt der Bässe */
    while(state==='choosing'&&beats.length&&now>=beats[0]){beats.shift();const w=order[hl];pixRing(w.x,w.y,'#ffffff',450,baseR*3.2,6,0,.85);chroma=Math.max(chroma,RM?.002:.012);if(!RM)shake=Math.max(shake,3);buzz(60);}
    if(state==='choosing'&&!pauseUntil){const c=hub(aliveList()),cur=order[hl];let d=((Math.atan2(cur.y-c.y,cur.x-c.x)-sweep)%6.2832+6.2832)%6.2832;if(d>5.8)d-=6.2832;sweep+=d*Math.min(1,.3*k);
      if(finalHold)for(let i=0;i<Math.round(4*k);i++){const a=Math.random()*6.2832,r=40+Math.random()*50;addP({x:cur.x+Math.cos(a)*r,y:cur.y+Math.sin(a)*r,vx:-Math.cos(a)*3,vy:-Math.sin(a)*3,life:18,max:18,size:3,col:Math.random()<.5?'#ff6b00':'#fff01f',drag:1,g:0});}}}
  if(state==='finale'){const el=now-finaleStart;rain(Math.round((GLR?4:9)*k));
    if(Math.random()<.18*k)burst(winner.x,winner.y,winner.col,40,11);
    if(el>1900){state='done';doneStart=now;nextFw=now+300;if(touches.size===0&&order.some(f=>!f.mouse))resetAt=now+3200;updHud();syncMusic();}}
  if(state==='done'){rain(Math.round(2*k));if(Math.random()<.3*k)confetti(Math.random()*W,-10,1,1.5,0);
    if(now>nextFw){nextFw=now+450+Math.random()*700;const x=W*(.12+Math.random()*.76),y=H*(.12+Math.random()*.6),c=Math.random()<.6?winner.col:NEON[Math.random()*NEON.length|0];
      burst(x,y,c,80,7);pixRing(x,y,c,500,90,4);if(snd)snd.sfx.firework();}
    if(resetAt&&now>resetAt)reset();}
  if(beam&&now-beam.t>200)beam=null;
  for(let i=rings.length-1;i>=0;i--)if(now>rings[i].t0+rings[i].dur)rings.splice(i,1);
  idleA+=((state==='idle'&&!fingers.size?1:0)-idleA)*Math.min(1,.06*k);
  linkA+=((state==='waiting'||state==='choosing'?1:0)-linkA)*Math.min(1,.12*k);
  /* Kamerafahrt über die Arena: gemächlich im Leerlauf, Beschleunigung bei der Auswahl, fast Stillstand vor der Entscheidung, Warp-Stoß beim Gewinner */
  {const tg=state==='idle'?1.4:state==='waiting'?4:state==='choosing'?(finalHold?.5:5+20*(steps?step/steps:0)):state==='finale'?3:2;
    camSpd+=(tg-camSpd)*Math.min(1,(state==='finale'?.03:.06)*k);camScroll+=camSpd*k/60;camKick*=Math.pow(.93,k);}
}
function stepParts(k){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.home){if(p.delay>0)p.delay-=k;else{const dx=p.home.x-p.x,dy=p.home.y-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*1.5*k;p.vy+=dy/d*1.5*k;
      if(d<26){p.life=0;if(Math.random()<.3)burst(p.home.x,p.home.y,'#ffffff',2,4,2);}}}
    if(p.t===1){p.rot+=p.vr*k;p.fl+=.12*k;p.vx+=Math.sin(p.fl*.7)*.04*k;}
    const dr=Math.pow(p.drag,k);p.vx*=dr;p.vy*=dr;p.vy+=p.g*k;p.x+=p.vx*k;p.y+=p.vy*k;p.life-=k;
    if(p.life<=0||p.y>H+40||p.y<-60&&p.vy<0&&!p.dim){parts[i]=parts[parts.length-1];parts.pop();}}}

uniform vec4 uWin;uniform vec3 uWinC;uniform vec4 uMood;uniform vec4 uIdle;uniform vec4 uCam;uniform vec4 uSun;uniform vec3 uSunC;

  const g=ctx.createRadialGradient(winner.x,winner.y,baseR*3,winner.x,winner.y,Math.hypot(W,H)*.75);g.addColorStop(0,'rgba(5,1,13,0)');g.addColorStop(1,'rgba(5,1,13,'+a.toFixed(3)+')');
  ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,H+80);}
function drawRays(now){if(!winner||!(state==='finale'||state==='done'))return;const a=Math.min(1,(now-finaleStart)/700),L=Math.hypot(W,H),n=14,rot=now/(RM?9000:3200),x=winner.x,y=winner.y;
  const g=ctx.createRadialGradient(x,y,baseR,x,y,L*.7);g.addColorStop(0,rgba(winner.col,(.22*a).toFixed(3)));g.addColorStop(1,rgba(winner.col,0));
  ctx.fillStyle=g;ctx.beginPath();for(let i=0;i<n;i++){const a0=rot+i*6.2832/n;ctx.moveTo(x,y);ctx.arc(x,y,L,a0,a0+3.1416/n);ctx.closePath();}ctx.fill();}
function glitch(){ctx.setTransform(1,0,0,1,0,0);for(let i=0;i<5;i++){const h=(6+Math.random()*28)*DPR|0,y=Math.random()*(cv.height-h)|0,dx=(Math.random()-.5)*44*DPR|0;ctx.drawImage(cv,0,y,cv.width,h,dx,y,cv.width,h);}ctx.setTransform(DPR,0,0,DPR,0,0);}
function render2D(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(5,1,13,.42)';ctx.fillRect(0,0,W,H);
  if(shake>0)ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  drawGrid(now);drawSpot(now);
  ctx.globalCompositeOperation='lighter';
  if(winner&&state==='done'){const g=ctx.createRadialGradient(winner.x,winner.y,0,winner.x,winner.y,Math.hypot(W,H)*.6);g.addColorStop(0,rgba(winner.col,.12));g.addColorStop(1,rgba(winner.col,0));ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,H+80);}
  drawRays(now);drawGridGlow();drawIdle(now);drawWave(now);drawLinks(now);drawSweep();drawRings(now);drawBeam(now);drawParts2D();drawFingers(now);
  ctx.globalCompositeOperation='source-over';
  if(state==='finale'&&!RM&&now-finaleStart<520)glitch();
  if(flash>.01){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=rgba(flashCol,flash.toFixed(3));ctx.fillRect(0,0,W,H);}}

/* ---------- Start und Hauptschleife ---------- */
function use2D(){const n=document.createElement('canvas');n.id='c';cv.replaceWith(n);cv=n;ctx=cv.getContext('2d');GLR=null;document.body.classList.remove('gl','gl3d');resize();}
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=window.innerWidth;H=window.innerHeight;
  if(GLR){GLR.resize();return;}
  if(!ctx)return;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05010d';ctx.fillRect(0,0,W,H);}
window.addEventListener('resize',resize);
DPR=Math.min(window.devicePixelRatio||1,3);W=window.innerWidth;H=window.innerHeight;
GLR=mkGL(cv);if(GLR){document.body.classList.add('gl');resize();}else use2D();

let last=performance.now(),qn=0,qa=0;
function frame(now){const dt=Math.min(50,now-last);last=now;const k=dt/16.667;
  {const n=(state==='finale'||state==='done')?1:Math.max(fingers.size,order.length,1);baseR+=(baseTarget(n)-baseR)*Math.min(1,.15*k);}
  update(now,k);stepParts(k);updCrown();updBomb();if(state==='waiting')hubPos=hub([...fingers.values()]);updCount();
  if(GLR){try{GLR.render(now);}catch(err){console.warn(err);use2D();}}else render2D(now);
  if(shake>0){shake*=Math.pow(.88,k);if(shake<.15)shake=0;}
  flash*=Math.pow(.86,k);chroma*=Math.pow(.9,k);
  /* Kommt das Gerät nicht hinterher (Ø über 26 ms pro Bild), Auflösung senken – bei sehr langsamen Geräten in größeren Schritten */
  if(GLR){qa+=dt;qn++;if(qn>=40||qn>=10&&qa>=600){const avg=qa/qn;if(avg>26&&qs>.36){qs=Math.max(.35,qs*(avg>40?.65:.82));resize();}qa=qn=0;}}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
