<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auserwählt">
<title>Der Auserwählte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#05010d;--fg:#f3ecff;--dim:#8a7fb0;--c:#ff2bd6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05010d;--fg:#f3ecff;--dim:#8a7fb0}}
:root[data-theme="dark"]{--bg:#05010d;--fg:#f3ecff;--dim:#8a7fb0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Press Start 2P",ui-monospace,"Courier New",monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fx{position:fixed;inset:0;pointer-events:none}
#scan{background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.07) 3px 4px)}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.hud{position:fixed;left:0;right:0;pointer-events:none;text-align:center;padding:0 18px}
#top{top:calc(env(safe-area-inset-top,0px) + 16px);font-size:10px;letter-spacing:.15em;color:var(--dim)}
#msg{top:50%;transform:translateY(-50%);font-size:clamp(13px,4vw,22px);line-height:1.9;color:#fff;text-shadow:0 0 8px var(--c),0 0 24px var(--c);transition:opacity .3s}
#msg small{display:block;font-size:.5em;line-height:2;color:var(--dim);text-shadow:none;margin-top:16px}
#msg.blink b{animation:blink 1.1s steps(2) infinite}
#msg b{font-weight:400}
@keyframes blink{50%{opacity:.2}}
#bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:8px;line-height:2.2;color:var(--dim)}
#seed{color:#cfc6f0}
#title{position:fixed;left:0;right:0;text-align:center;pointer-events:none;font-size:clamp(20px,7.4vw,64px);color:#fff;opacity:0;
  text-shadow:-3px 0 #00f0ff,3px 0 #ff2bd6,0 0 18px var(--c),0 0 48px var(--c),0 0 90px var(--c)}
#title.show{animation:slam .55s cubic-bezier(.2,1.7,.35,1) forwards,glitch 2.2s .6s infinite}
@keyframes slam{0%{opacity:0;transform:scale(4) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes glitch{0%,86%,100%{transform:none;opacity:1}88%{transform:translate(-6px,2px) skewX(12deg)}90%{transform:translate(5px,-2px);opacity:.7}92%{transform:translate(-2px,0) skewX(-8deg)}94%{transform:none}}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:var(--fg);font:inherit;font-size:16px;padding:8px 10px;border-radius:4px;touch-action:none;cursor:pointer}
#mute:focus-visible{outline:2px solid #00f0ff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="fx" id="vig"></div>
<div class="fx" id="scan"></div>
<div class="hud" id="top">Der Auserwählte</div>
<div class="hud" id="msg"></div>
<div id="title">AUSERWÄHLT!</div>
<div class="hud" id="bottom"><div id="seed">Jede Runde mit frischem Zufalls-Seed</div><div id="hint"></div></div>
<button id="mute" aria-label="Ton an oder aus">🔊</button>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const msgEl=$(\'msg\'),titleEl=$('title'),seedEl=$(\'seed\'),hintEl=$('hint'),topEl=$(\'top\'),muteBtn=$('mute');
const FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05010d';ctx.fillRect(0,0,W,H);}
window.addEventListener('resize',resize);resize();

const NEON=['#ff2bd6','#00f0ff','#39ff14','#fff01f','#ff6b00','#b026ff','#ff1744','#00ff9c','#4d7cff','#ff9ef5','#c6ff00','#00b3ff'];
const cache={};
function rgb(h){if(cache[h])return cache[h];const n=parseInt(h.slice(1),16);return cache[h]=[(n>>16)&255,(n>>8)&255,n&255];}
function rgba(h,a){const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ---------- Zufall: frischer Seed je Runde + seeded PRNG ---------- */
let entropy=(Math.random()*4294967296)>>>0;
function mix(e){entropy=Math.imul(entropy^((e.clientX*1000)|0)^(((e.clientY*1000)|0)<<7)^((performance.now()*1000)|0),2654435761)>>>0;}
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return (t>>>0)/4294967296;};}
function freshSeed(){const s=new Uint32Array(4);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(s);else for(let i=0;i<4;i++)s[i]=(Math.random()*4294967296)>>>0;
  s[0]^=(performance.now()*1000)>>>0;s[1]^=Date.now()>>>0;s[2]^=entropy;s[3]^=(Math.random()*4294967296)>>>0;
  if(!(s[0]|s[1]|s[2]|s[3]))s[3]=1;return s;}

/* ---------- Sound ---------- */
let AC=null,master=null,muted=false;
function initAudio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.06,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
function noise(d,v,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const len=Math.floor(AC.sampleRate*d);const b=AC.createBuffer(1,len,AC.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(7000,t);f.frequency.exponentialRampToValueAtTime(60,t+d);const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d);}
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
muteBtn.addEventListener('pointerdown',e=>{e.stopPropagation();});
muteBtn.addEventListener('click',()=>{muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';});

/* ---------- Zustand ---------- */
const fingers=new Map(),touches=new Set(),parts=[],rings=[];
let state='idle',waitStart=0,lastTick=-1,order=[],hl=-1,steps=0,step=0,nextAt=0,finalHold=false,winner=null;
let finaleStart=0,doneStart=0,resetAt=0,nextFw=0,round=0,mouseN=0,shake=0,flash=0,flashCol='#ffffff',beam=null;
const WAIT=1500,PICK_MS=5600;let baseR=44,delays=[];

function addP(p){if(parts.length<6500)parts.push(p);}
function burst(x,y,col,n,spd,sz){for(let i=0;i<n;i++){const a=Math.random()*6.2832,s=(.25+Math.random())*spd,life=28+Math.random()*50;
  addP({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:sz||(2+(Math.random()*4|0)),col:Math.random()<.15?'#ffffff':col,drag:.955,g:0});}}
function pixRing(x,y,col,dur,maxR,w,delay){rings.push({x,y,col,t0:performance.now()+(delay||0),dur,maxR,w});}

function pickColor(){const used=new Set([...fingers.values()].map(f=>f.col));const free=NEON.filter(c=>!used.has(c));const pool=free.length?free:NEON;return pool[Math.floor(Math.random()*pool.length)];}
function addFinger(id,x,y,mouse){const f={id,x,y,col:pickColor(),born:performance.now(),mouse,ph:Math.random()*6.2832,lifted:false,dying:0};
  fingers.set(id,f);burst(x,y,f.col,50,5);pixRing(x,y,f.col,520,130,6);tone(300+fingers.size*90,.12,'square',.06,1.6);buzz(15);armWait();}
function dropFinger(id){const f=fingers.get(id);if(!f)return;
  if(state==='idle'||state==='waiting'){fingers.delete(id);burst(f.x,f.y,f.col,34,3);tone(260,.1,'triangle',.05,.5);armWait();}
  else f.lifted=true;}
function armWait(){if(fingers.size>=2){state='waiting';waitStart=performance.now();lastTick=-1;}else state='idle';updHud();}
function reset(){fingers.clear();order=[];winner=null;hl=-1;beam=null;state='idle';resetAt=0;titleEl.className='';updHud();}

/* ---------- Eingabe ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();mix(e);const now=performance.now();
  if(e.pointerType==='mouse'){if(e.button!==0)return;
    if(state==='done'){reset();return;}
    if(state==='choosing'||state==='finale')return;
    for(const f of fingers.values())if(f.mouse&&Math.hypot(f.x-e.clientX,f.y-e.clientY)<60){dropFinger(f.id);return;}
    addFinger('m'+(mouseN++),e.clientX,e.clientY,true);return;}
  const wasEmpty=touches.size===0;touches.add(e.pointerId);
  if(state==='done'){if(wasEmpty&&now-doneStart>800)reset();else return;}
  if(state==='choosing'||state==='finale')return;
  addFinger(e.pointerId,e.clientX,e.clientY,false);
},{passive:false});
cv.addEventListener('pointermove',e=>{mix(e);const f=fingers.get(e.pointerId);if(f&&!f.lifted&&!f.mouse&&state!=='finale'&&state!=='done'){f.x=e.clientX;f.y=e.clientY;}},{passive:true});
function up(e){if(e.pointerType==='mouse')return;touches.delete(e.pointerId);dropFinger(e.pointerId);
  if(state==='done'&&touches.size===0)resetAt=Math.max(performance.now()+1400,doneStart+2600);}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
['touchstart','touchmove','touchend'].forEach(t=>document.addEventListener(t,e=>{if(e.target===cv)e.preventDefault();},{passive:false}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- HUD ---------- */
function updHud(){let h='',blink=false;
  if(state==='idle'){if(fingers.size===0){h='<b>Finger aufs<br>Display!</b><small>Ab 2 Fingern geht’s los'+(FINE?'<br>Am Desktop: Klick setzt einen Punkt,<br>Klick auf den Punkt entfernt ihn':'')+'</small>';blink=true;}
    else h='Noch ein<br>Finger …<small>Mindestens 2 Spieler</small>';}
  else if(state==='waiting')h='Still<br>halten …';
  else if(state==='choosing')h='Das Schicksal<br>wählt …';
  msgEl.innerHTML=h;msgEl.classList.toggle('blink',blink);
  msgEl.style.opacity=(state==='finale'||state==='done')?0:(fingers.size?.6:1);
  hintEl.textContent=state==='done'?(order.some(f=>!f.mouse)?'Alle Finger loslassen für die nächste Runde':'Klick für die nächste Runde'):'';
  topEl.textContent=round?'Der Auserwählte – Runde '+round:'Der Auserwählte';}
updHud();

/* ---------- Auswahl ---------- */
function startChoosing(){const now=performance.now();const s=freshSeed();
  const hex=[...s].map(v=>v.toString(16).padStart(8,'0')).join('').toUpperCase();
  const rng=sfc32(s[0],s[1],s[2],s[3]);for(let i=0;i<24;i++)rng();
  const list=[...fingers.values()];let cx=0,cy=0;list.forEach(f=>{cx+=f.x;cy+=f.y;});cx/=list.length;cy/=list.length;
  order=list.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));
  const n=order.length,win=Math.floor(rng()*n),start=Math.floor(rng()*n),laps=(n>=5?3:4)+Math.floor(rng()*2);
  steps=laps*n+((win-start+n)%n);step=0;{let sw=0;const w=[];for(let i=1;i<=steps;i++){const v=.05+Math.pow(i/steps,3.2);w.push(v);sw+=v;}delays=w.map(v=>Math.min(950,Math.max(28,PICK_MS*v/sw)));}hl=start;winner=order[win];nextAt=now+260;finalHold=false;state='choosing';round++;
  seedEl.textContent='Seed 0x'+hex.slice(0,16)+'…';
  tone(70,.7,'sawtooth',.1,3);order.forEach(f=>pixRing(f.x,f.y,f.col,600,160,5));updHud();}

function startFinale(){const now=performance.now(),w=winner;state='finale';finaleStart=now;
  shake=RM?0:32;flash=RM?.35:.9;flashCol=w.col;beam=null;
  for(let i=0;i<1000;i++){const a=Math.random()*6.2832,s=2+Math.random()*17,life=50+Math.random()*95;
    addP({x:w.x,y:w.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:3+(Math.random()*6|0),
      col:Math.random()<.2?'#ffffff':(Math.random()<.15?NEON[Math.random()*NEON.length|0]:w.col),drag:.955,g:.045});}
  const big=Math.hypot(W,H);for(let i=0;i<6;i++)pixRing(w.x,w.y,i%2?'#ffffff':w.col,950,big,10-i,i*110);
  order.forEach(f=>{if(f===w)return;f.dying=now;
    for(let i=0;i<130;i++)addP({x:f.x+(Math.random()-.5)*70,y:f.y+(Math.random()-.5)*70,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:220,max:220,size:3+(Math.random()*3|0),col:f.col,drag:.94,g:0,home:w,delay:Math.random()*25});});
  tone(55,1.8,'sawtooth',.22,.45);tone(110,1.3,'square',.1,.3);noise(1.3,.35);
  [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.25,'square',.055,0,.15+i*.07));
  [523,659,784,1047].forEach(f=>tone(f,1.6,'triangle',.06,0,.62));
  buzz([90,40,260]);
  titleEl.style.setProperty('--c',w.col);titleEl.style.top=w.y<H/2?'72%':'18%';
  titleEl.className='';void titleEl.offsetWidth;titleEl.className='show';updHud();}

/* ---------- Update ---------- */
function rain(n){for(let i=0;i<n;i++){const life=H/5+40;addP({x:Math.random()*W,y:-10,vx:0,vy:5+Math.random()*7,life,max:life,size:3+(Math.random()*4|0),col:Math.random()<.3?'#ffffff':winner.col,drag:1,g:.05});}}
function update(now,k){
  if(state==='idle'&&Math.random()<.55*k){const life=260+Math.random()*200;addP({x:Math.random()*W,y:H+6,vx:0,vy:-(.3+Math.random()*1),life,max:life,size:2+(Math.random()*2|0),col:NEON[Math.random()*NEON.length|0],drag:1,g:0,dim:true});}
  if(state==='waiting'){const p=(now-waitStart)/WAIT,seg=Math.floor(p*8);
    if(seg>lastTick&&seg<8){lastTick=seg;tone(420+seg*70,.05,'square',.035);}
    fingers.forEach(f=>{if(Math.random()<.35*k){const a=Math.random()*6.2832;addP({x:f.x+Math.cos(a)*60,y:f.y+Math.sin(a)*60,vx:0,vy:-1-Math.random()*2,life:40,max:40,size:3,col:f.col,drag:.98,g:0});}});
    if(p>=1)startChoosing();}
  if(state==='choosing'){
    if(now>=nextAt){
      if(finalHold)startFinale();
      else{const prev=order[hl];hl=(hl+1)%order.length;step++;const cur=order[hl],p=step/steps;
        beam={a:prev,b:cur,t:now,col:cur.col};
        burst(cur.x,cur.y,cur.col,(18+p*34)|0,3+p*5);pixRing(cur.x,cur.y,cur.col,360,100,4);
        tone(200+p*760,.07,'square',.05+p*.04);if(!RM)shake=Math.max(shake,1+p*5);buzz(8);
        nextAt=now+delays[step-1];
        if(step>=steps){finalHold=true;nextAt=now+1500;[0,.38,.9,1.15].forEach(d=>tone(60,.3,'sine',.3,0,d));noise(.25,.08,.38);}}}
    if(finalHold){const w=order[hl];for(let i=0;i<Math.round(4*k);i++){const a=Math.random()*6.2832,r=40+Math.random()*50;addP({x:w.x+Math.cos(a)*r,y:w.y+Math.sin(a)*r,vx:-Math.cos(a)*3,vy:-Math.sin(a)*3,life:18,max:18,size:3,col:Math.random()<.5?'#fff':w.col,drag:1,g:0});}}}
  if(state==='finale'){const el=now-finaleStart;rain(Math.round(9*k));
    if(Math.random()<.18*k)burst(winner.x,winner.y,winner.col,40,11);
    if(el>1900){state='done';doneStart=now;nextFw=now+300;if(touches.size===0&&order.some(f=>!f.mouse))resetAt=now+3200;updHud();}}
  if(state==='done'){rain(Math.round(2*k));
    if(now>nextFw){nextFw=now+450+Math.random()*700;const x=W*(.12+Math.random()*.76),y=H*(.12+Math.random()*.6),c=Math.random()<.6?winner.col:NEON[Math.random()*NEON.length|0];
      burst(x,y,c,80,7);pixRing(x,y,c,500,90,4);noise(.18,.06);}
    if(resetAt&&now>resetAt)reset();}
}

/* ---------- Zeichnen ---------- */
let stars=null,sW=0,sH=0;
function drawGrid(now){const c=winner&&(state==='finale'||state==='done')?winner.col:'#b026ff',hp=1/DPR;
  ctx.fillStyle=rgba(c,.09);for(let x=0;x<W;x+=40)ctx.fillRect(x,0,hp,H);for(let y=0;y<H;y+=40)ctx.fillRect(0,y,W,hp);
  ctx.fillStyle=rgba(c,.12);for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40)ctx.fillRect(x-1,y-1,2,2);
  if(!stars||sW!==W||sH!==H){sW=W;sH=H;stars=[];const n=Math.round(W*H/5000);for(let i=0;i<n;i++)stars.push({x:Math.random()*W|0,y:Math.random()*H|0,s:Math.random()<.15?2:1,p:Math.random()*6.28,v:.5+Math.random()*2});}
  for(const s of stars){const a=.12+.18*Math.sin(now/600*s.v+s.p);if(a<=0)continue;ctx.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';ctx.fillRect(s.x,s.y,s.s,s.s);}}
function drawWave(now){if(!winner||!(state==='finale'||state==='done'))return;const el=now-finaleStart;if(el>2600)return;
  const maxD=Math.hypot(W,H),cell=14,wx=winner.x,wy=winner.y;
  const fr=[[el/1100*maxD,winner.col,1],[(el-260)/1100*maxD,'#ffffff',.7],[(el-620)/1300*maxD,winner.col,.5]];
  for(let gy=0;gy<H;gy+=cell)for(let gx=0;gx<W;gx+=cell){const d=Math.hypot(gx+7-wx,gy+7-wy);
    for(let j=0;j<3;j++){const r=fr[j][0];if(r<=0)continue;const q=Math.abs(d-r);
      if(q<48){if(Math.random()<.88){ctx.fillStyle=rgba(fr[j][1],((1-q/48)*fr[j][2]).toFixed(3));ctx.fillRect(gx+1,gy+1,cell-2,cell-2);}}
      else if(j===0&&d<r&&Math.random()<.025){ctx.fillStyle=rgba(winner.col,.3);ctx.fillRect(gx+1,gy+1,cell-2,cell-2);}}}}
function drawRings(now){for(let i=rings.length-1;i>=0;i--){const r=rings[i];if(now<r.t0)continue;const p=(now-r.t0)/r.dur;
  if(p>=1){rings.splice(i,1);continue;}const R=r.maxR*(1-Math.pow(1-p,3)),n=Math.min(260,Math.max(12,R*6.2832/9|0)),s=Math.max(2,r.w*(1-p)+2);
  ctx.fillStyle=rgba(r.col,(1-p).toFixed(3));for(let j=0;j<n;j++){const a=j/n*6.2832;ctx.fillRect((r.x+Math.cos(a)*R-s/2)|0,(r.y+Math.sin(a)*R-s/2)|0,s,s);}}}
function drawBeam(now){if(!beam)return;const age=now-beam.t;if(age>200){beam=null;return;}const a=1-age/200;
  const x1=beam.a.x,y1=beam.a.y,x2=beam.b.x,y2=beam.b.y,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  const segs=Math.max(6,L/22|0);let px=x1,py=y1;ctx.fillStyle=rgba(beam.col,a.toFixed(3));
  for(let i=1;i<=segs;i++){const t=i/segs,o=i===segs?0:(Math.random()-.5)*26;const qx=x1+dx*t+nx*o,qy=y1+dy*t+ny*o;
    const sl=Math.hypot(qx-px,qy-py),st=Math.max(1,sl/5|0);for(let j=0;j<st;j++){ctx.fillRect((px+(qx-px)*j/st-3)|0,(py+(qy-py)*j/st-3)|0,6,6);}px=qx;py=qy;}}
function drawParts(k){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.home){if(p.delay>0)p.delay-=k;else{const dx=p.home.x-p.x,dy=p.home.y-p.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*1.5*k;p.vy+=dy/d*1.5*k;
      if(d<26){p.life=0;if(Math.random()<.3)burst(p.home.x,p.home.y,'#ffffff',2,4,2);}}}
    const dr=Math.pow(p.drag,k);p.vx*=dr;p.vy*=dr;p.vy+=p.g*k;p.x+=p.vx*k;p.y+=p.vy*k;p.life-=k;
    if(p.life<=0||p.y>H+40||p.y<-60&&p.vy<0&&!p.dim){parts[i]=parts[parts.length-1];parts.pop();continue;}
    ctx.globalAlpha=Math.min(1,p.life/p.max*1.5)*(p.dim?.35:1);ctx.fillStyle=p.col;
    ctx.fillRect(((p.x/3)|0)*3,((p.y/3)|0)*3,p.size,p.size);}
  ctx.globalAlpha=1;}
function drawFinger(f,now,o){
  let x=f.x,y=f.y;const age=Math.min(1,(now-f.born)/220),e=1-Math.pow(1-age,3);
  let R=baseR*e*(1+.07*Math.sin(now/170+f.ph))*(o.scale||1),a=(f.lifted&&state!=='done'&&state!=='finale'?.55:1)*(o.alpha==null?1:o.alpha);
  if(o.jit){x+=(Math.random()-.5)*o.jit;y+=(Math.random()-.5)*o.jit;}
  if(R<1||a<=.01)return;const c=f.col;ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x,y,0,x,y,R*2.4);g.addColorStop(0,rgba(c,.55));g.addColorStop(.4,rgba(c,.18));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R*2.4,0,6.2832);ctx.fill();
  ctx.shadowColor=c;ctx.shadowBlur=18;ctx.lineWidth=7;ctx.strokeStyle=c;ctx.beginPath();ctx.arc(x,y,R,0,6.2832);ctx.stroke();ctx.shadowBlur=0;
  ctx.lineWidth=2;ctx.strokeStyle='#ffffff';ctx.beginPath();ctx.arc(x,y,R,0,6.2832);ctx.stroke();
  const sp=now/(o.hot?300:900)+f.ph;ctx.lineWidth=3;ctx.strokeStyle=o.hot?'#ffffff':c;ctx.setLineDash([R*.32,R*.18]);ctx.beginPath();ctx.arc(x,y,R*.74,sp,sp+6.2832);ctx.stroke();ctx.setLineDash([]);
  ctx.lineWidth=1.5;ctx.strokeStyle=rgba(c,.7);ctx.beginPath();ctx.arc(x,y,R*.5,0,6.2832);ctx.stroke();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,R*.26,0,6.2832);ctx.fill();ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(x,y,R*.15,0,6.2832);ctx.fill();
  ctx.fillStyle=rgba(c,.9);for(let i=0;i<4;i++){const an=i*1.5708+sp*.25;ctx.save();ctx.translate(x+Math.cos(an)*R*1.08,y+Math.sin(an)*R*1.08);ctx.rotate(an);ctx.fillRect(0,-1.5,R*.15,3);ctx.restore();}
  const n=o.orbit||8,rot=now/(o.hot?130:420)+f.ph;ctx.fillStyle=c;
  for(let i=0;i<n;i++){const an=rot+i*6.2832/n;ctx.fillRect((x+Math.cos(an)*(R*1.3+4)-3)|0,(y+Math.sin(an)*(R*1.3+4)-3)|0,6,6);}
  if(o.prog!=null){const segs=24,lit=Math.floor(o.prog*segs);for(let i=0;i<segs;i++){const an=-Math.PI/2+i*6.2832/segs;
    ctx.fillStyle=i<lit?'#ffffff':rgba(c,.25);ctx.fillRect((x+Math.cos(an)*(R*1.6+6)-3)|0,(y+Math.sin(an)*(R*1.6+6)-3)|0,6,6);}}
  ctx.globalAlpha=1;return R;}
function drawBrackets(x,y,s,col){const L=Math.max(10,s*.35),t=3;ctx.fillStyle=col;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{const cx=Math.round(x+sx*s),cy=Math.round(y+sy*s);ctx.fillRect(sx<0?cx:cx-L,cy-(sy<0?0:t),L,t);ctx.fillRect(cx-(sx<0?0:t),sy<0?cy:cy-L,t,L);});}
const CROWN=['1...1...1','11.111.11','111111111','111111111','1.1.1.1.1'];
function drawCrown(w,R,now){const s=7,x0=w.x-31.5,y0=w.y-R-62+Math.sin(now/260)*5;
  for(let r=0;r<CROWN.length;r++)for(let c=0;c<9;c++)if(CROWN[r][c]==='1'){ctx.fillStyle=r===0||(r===4&&c%2===0)?'#ffffff':'#ffe14d';ctx.fillRect(x0+c*s,y0+r*s,s-1,s-1);}}
function drawFingers(now){
  if(state==='idle'||state==='waiting'){const p=state==='waiting'?Math.min(1,(now-waitStart)/WAIT):null;fingers.forEach(f=>drawFinger(f,now,{prog:p}));return;}
  if(state==='choosing'){const cur=order[hl];order.forEach(f=>{const hot=f===cur;drawFinger(f,now,{hot,scale:hot?1.32:.9,alpha:hot?1:.42,orbit:hot?12:6,jit:finalHold&&hot?5:0});});
    drawBrackets(cur.x,cur.y,baseR*(finalHold?1.9+.25*Math.sin(now/60):2.2),finalHold?'#ffffff':cur.col);return;}
  order.forEach(f=>{if(f===winner||!f.dying)return;const t=(now-f.dying)/650;if(t<1)drawFinger(f,now,{scale:1-t,alpha:1-t,jit:10*t});});
  const R=drawFinger(winner,now,{hot:true,scale:1.55+.1*Math.sin(now/150),orbit:16});
  if(state==='done'||now-finaleStart>500)drawCrown(winner,R||70,now);}

let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;const k=dt/16.667;
  {const n=(state==='finale'||state==='done')?1:Math.max(fingers.size,order.length,1);const tgt=44*Math.min(1,Math.sqrt(4/n))*Math.min(1.4,Math.max(.8,Math.min(W,H)/400));baseR+=(tgt-baseR)*Math.min(1,.15*k);}
  update(now,k);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(5,1,13,.42)';ctx.fillRect(0,0,W,H);
  if(shake>0){ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);shake*=Math.pow(.88,k);if(shake<.15)shake=0;}
  drawGrid(now);
  ctx.globalCompositeOperation='lighter';
  if(winner&&state==='done'){const g=ctx.createRadialGradient(winner.x,winner.y,0,winner.x,winner.y,Math.hypot(W,H)*.6);g.addColorStop(0,rgba(winner.col,.12));g.addColorStop(1,rgba(winner.col,0));ctx.fillStyle=g;ctx.fillRect(-40,-40,W+80,H+80);}
  drawWave(now);drawRings(now);drawBeam(now);drawParts(k);drawFingers(now);
  ctx.globalCompositeOperation='source-over';
  if(flash>.01){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=rgba(flashCol,flash.toFixed(3));ctx.fillRect(0,0,W,H);flash*=Math.pow(.86,k);}
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
